# GitHub Actions workflow for Agent2LLM.
#
# Runs on every push to main and every pull request against it.
#
# Mock-only by design: this suite contacts no real provider. Real-provider E2E
# needs accounts and quota, so it stays in `npm run e2e:relay`, which is run by
# a person on a machine that has them — and which reports a failure as a fact
# about that machine rather than as a broken build.
#
# This file used to sit outside `.github/workflows/` on purpose: a push that
# creates or updates a workflow file is refused unless the credential carries
# the `workflow` scope, and the repository was being pushed with `repo` alone.
# It moved in once a credential with that scope was available.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Agent detection is platform-dependent, so Windows is not optional.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck / build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          AGENT2LLM_STATE_DIR: ${{ runner.temp }}/a2l-state

      - name: CLI smoke
        run: node apps/cli/dist/index.js --help
        env:
          AGENT2LLM_STATE_DIR: ${{ runner.temp }}/a2l-state

      - name: Mock end-to-end
        run: node apps/cli/dist/index.js run --brain mock-brain --harness mock-harness --goal "smoke"
        env:
          AGENT2LLM_STATE_DIR: ${{ runner.temp }}/a2l-state
